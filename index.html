<style>

.card{border-radius:18px;box-shadow:0 2px 0 var(--line)}

<script>
/* Lõi: phân tích dữ liệu bài học và chấm điểm phát âm (không phụ thuộc trình duyệt) */
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(arr,seed){var a=arr.slice(),r=rng(seed);for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function mcq(id,q,opts,ans,exp){
  var idx=shuffled(opts.map(function(_,i){return i;}),hash(id));
  return {id:id,q:q,o:idx.map(function(i){return {t:opts[i],ok:i===ans};}),e:exp||''};
}
function parseData(raw){
  var weeks=[],w=null,blk=null;
  raw.split('\n').forEach(function(line){
    line=line.trim(); if(line.charAt(0)!=='@')return;
    var sp=line.indexOf(' '), tag=line.slice(1,sp), f=line.slice(sp+1).split('|').map(function(x){return x.trim();});
    if(tag==='week'){w={n:weeks.length+1,title:f[0],focus:f[1]||'',vocab:[],sents:[],p5:[],p2:[],blocks:[]};weeks.push(w);blk=null;return;}
    if(!w)return;
    var n=w.n;
    if(tag==='v')w.vocab.push({id:'w'+n+'v'+w.vocab.length,w:f[0],m:f[1],ex:f[2]});
    else if(tag==='s')w.sents.push({id:'w'+n+'s'+w.sents.length,t:f[0],vi:f[1]});
    else if(tag==='p5')w.p5.push(mcq('w'+n+'a'+w.p5.length,f[0],f.slice(1,5),'ABCD'.indexOf(f[5]),f[6]));
    else if(tag==='p2')w.p2.push(mcq('w'+n+'l'+w.p2.length,f[0],f.slice(1,4),'ABCD'.indexOf(f[4])));
    else if(tag==='dlg'||tag==='rd'){
      blk={id:'w'+n+'b'+w.blocks.length,type:tag,title:f[0],qs:[]};

@x ______ you check my balance, please?|Could|Would to|Can to|Should to|A|Could cộng you cộng động từ là câu nhờ lịch sự.
@x You ______ keep your PIN secret.|should|should to|shoulds|shoulding|A|Should cộng động từ nguyên mẫu.
@x Staff must not ______ customer data.|disclose|disclosed|disclosing|to disclose|A|Must not cộng động từ nguyên mẫu.
@x You ______ have called us earlier.|should|will|did|are|A|Should have + V3 nghĩa là lẽ ra đã nên.
@x A late fee ______ apply if you pay after the due date.|may|may to|mays|maying|A|May cộng động từ nguyên mẫu.
@x I would like ______ an account.|open|to open|opening|opened|B|Would like to + động từ.
@x The bank ______ be closed on public holidays.|will|will to|wills|willing|A|Will cộng động từ nguyên mẫu.

@topic 7|Danh động từ và động từ nguyên mẫu|Hai động từ đi liền nhau: động từ sau phải là V-ing hoặc to + V.
@h Sau động từ nào dùng dạng nào
@t Nhóm ¦ Quy tắc ¦ Động từ thường gặp ¦ Ví dụ
@r Sau giới từ ¦ Luôn V-ing ¦ interested in, thank you for, before, after, by ¦ Thank you for **choosing** our bank.
@r Động từ + V-ing ¦ Hành động đang diễn ra hoặc đã qua ¦ enjoy, avoid, consider, suggest, finish, keep, mind, recommend, delay ¦ We **suggest checking** your balance weekly.
@r Động từ + to + V ¦ Dự định, mong muốn ¦ want, plan, hope, decide, agree, need, expect, offer, refuse ¦ We **plan to launch** a new product.
@r Động từ + O + to + V ¦ Yêu cầu ai làm gì ¦ ask, allow, require, remind, invite, enable, encourage ¦ The bank **requires applicants to submit** ID.
@r Mục đích ¦ to + V hoặc in order to + V ¦ ¦ We conducted a survey **to understand** customers.
@h Hai cụm "to" đánh lừa
@p Trong look forward to, be used to, be committed to, in addition to, contribute to thì "to" là giới từ nên theo sau là V-ing. We look forward to **hearing** from you.
@h Hai danh sách cần nhớ
@li Cộng V-ing: admit, avoid, consider, delay, deny, enjoy, finish, keep, mind, postpone, practice, recommend, suggest.
@li Cộng to + V: afford, agree, aim, arrange, decide, expect, fail, hope, intend, manage, offer, plan, promise, refuse, seem, want.
@x Thank you for ______ our bank.|choose|choosing|to choose|chosen|B|Sau giới từ for dùng V-ing.
@x We plan ______ a new product.|launching|to launch|launch|launched|B|Plan to + động từ.
@x The bank requires applicants ______ a valid ID.|show|showing|to show|shown|C|Require + O + to + V.
@x We look forward to ______ from you.|hear|hearing|heard|be hearing|B|Look forward to + V-ing, to là giới từ.
@x We suggest ______ your balance weekly.|check|checking|to check|checked|B|Suggest + V-ing.
@x She decided ______ the loan offer.|accepting|to accept|accept|accepted|B|Decide to + động từ.
@x He avoided ______ late fees by paying early.|to pay|paying|pay|paid|B|Avoid + V-ing.
@x The bank is committed to ______ customer data.|protect|protecting|to protecting|be protect|B|Committed to + V-ing, to là giới từ.

@topic 8|Phân từ|V-ing chủ động, V3 bị động, dùng làm tính từ và rút gọn mệnh đề.
@h V-ing và V3 làm tính từ
@t Dạng ¦ Nghĩa ¦ Ví dụ ¦ Gợi nhớ
@r V-ing ¦ Chủ động: gây ra, đang làm ¦ an **interesting** offer; the **growing** number of users ¦ Danh từ tạo ra hành động
@r V3 ¦ Bị động: bị tác động, đã được ¦ a **required** document; the **attached** file ¦ Danh từ nhận hành động
@h Cặp -ing và -ed về cảm xúc
@p interesting (gây hứng thú) và interested (cảm thấy hứng thú); satisfying và satisfied; confusing và confused; surprising và surprised. Người cảm thấy thì dùng -ed, thứ gây ra cảm xúc dùng -ing.
@h Rút gọn mệnh đề
@li The customer **who called** yesterday thành The customer **calling** yesterday (chủ động).
@li The email **that was sent** yesterday thành The email **sent** yesterday (bị động).
@x The ______ document must be signed.|attach|attached|attaching|attachment|B|Tài liệu được đính kèm: V3 bị động.
@x Customers ______ with the service rated it highly.|satisfy|satisfying|satisfied|satisfaction|C|Khách hàng cảm thấy hài lòng: dùng V3 satisfied.
@x The ______ number of users is good news.|grow|growing|grown|growth|B|Số lượng đang tăng: V-ing chủ động.
@x We received an ______ offer.|interest|interested|interesting|interestingly|C|Lời đề nghị gây hứng thú: interesting.
@x I am ______ in opening an account.|interest|interested|interesting|interests|B|Người cảm thấy hứng thú: interested.
@x The email ______ yesterday contained an error.|sending|sent|send|sends|B|Rút gọn bị động: which was sent thành sent.
@x The customer ______ at the counter is my client.|waited|waiting|waits|wait|B|Rút gọn chủ động: who is waiting thành waiting.
@x The ______ results surprised the team.|disappoint|disappointed|disappointing|disappointingly|C|Kết quả gây thất vọng: V-ing.

@topic 9|Mệnh đề quan hệ|Bổ sung thông tin cho danh từ đứng ngay trước: who, which, whose, where, that.
@h Chọn đại từ quan hệ
@t Danh từ trước ¦ Làm chủ ngữ ¦ Làm tân ngữ ¦ Sở hữu ¦ Ví dụ
@r Người ¦ who / that ¦ who(m) / that ¦ whose ¦ The teller **who** helped me was polite.
@r Vật ¦ which / that ¦ which / that ¦ whose ¦ The form **which** you need is here.
@r Nơi chốn ¦ where ¦ ¦ ¦ This is the branch **where** I opened my account.
@r Cả mệnh đề trước ¦ which (có dấu phẩy) ¦ ¦ ¦ Revenue rose 5 percent, **which** pleased the board.
@h Điều cần nhớ
@li Whose cộng danh từ: Customers **whose accounts** are overdue...
@li Sau who, which là động từ hoặc chủ ngữ mới; sau whose là danh từ.
@li Rút gọn: bỏ who/which cộng be. The customer who is waiting thành The customer waiting.
@li Giới từ đứng trước whom: The customer to **whom** I spoke...
@x The agent ______ helped me was polite.|which|whose|who|whom|C|Danh từ chỉ người làm chủ ngữ: who.
@x Customers ______ accounts are overdue will receive a notice.|who|whose|which|whom|B|Sở hữu, theo sau là danh từ accounts: whose.
@x The form ______ you need is on the counter.|who|which|whose|what|B|Danh từ chỉ vật, làm tân ngữ: which.
@x This is the branch ______ I opened my account.|who|where|what|whose|B|Danh từ chỉ nơi chốn: where.
@x Revenue rose 5 percent, ______ pleased the board.|what|who|which|where|C|Which thay cho cả mệnh đề trước.
@x The employee ______ the complaint will contact you.|handling|handled|handle|to handled|A|Rút gọn chủ động: who handles thành handling.
@x The documents ______ were attached are required.|that|who|whose|where|A|That thay cho vật làm chủ ngữ.
@x The customer to ______ I spoke was upset.|who|whom|which|whose|B|Sau giới từ dùng whom cho người.

@topic 10|Liên từ và giới từ|Liên từ đi với mệnh đề (có chủ ngữ và động từ), giới từ đi với cụm danh từ hoặc V-ing.
@h Cùng ý nghĩa, khác dạng
@t Ý nghĩa ¦ Liên từ + mệnh đề ¦ Giới từ + cụm danh từ
@r Vì ¦ because, since, as ¦ because of, due to, owing to
@r Mặc dù ¦ although, even though ¦ despite, in spite of
@r Trong khi, đối lập ¦ while, whereas ¦ during (+ danh từ)
@r Nếu ¦ if, unless, provided that ¦ in case of, without
@r Sau khi, trước khi ¦ after, before, once ¦ after, before (+ V-ing)
@r Để (mục đích) ¦ so that ¦ in order to + V, to + V
@p **Mẹo:** nhìn sau chỗ trống. Thấy chủ ngữ cộng động từ ("the card expired") thì chọn liên từ. Thấy cụm danh từ ("an expired card") thì chọn giới từ.
@h Giới từ thời gian và nơi chốn
@t Giới từ ¦ Dùng với ¦ Ví dụ
@r at ¦ giờ, điểm, địa điểm ¦ at 9 a.m., at the branch
@r on ¦ ngày, thứ, bề mặt ¦ on Monday, on March 5, on the form
@r in ¦ tháng, năm, mùa, không gian ¦ in March, in 2025, in the city
@r by ¦ hạn chót (trước lúc) ¦ by Friday
@r for ¦ khoảng thời gian ¦ for two years
@r since ¦ mốc thời gian ¦ since 2020
@r within ¦ trong vòng ¦ within five business days
@p **Cụm cố định hay thi:** apply for, responsible for, interested in, depend on, based on, in addition to, in accordance with, according to, as a result of, on behalf of, in charge of, under review.
@x ______ the high fee, the account is popular.|Although|Despite|Because|Whereas|B|Sau chỗ trống là cụm danh từ the high fee nên dùng giới từ Despite.
@x The payment was delayed ______ a system error.|because|due to|although|so that|B|A system error là cụm danh từ: due to.
@x Please submit the form ______ Friday.|by|since|during|among|A|By cộng hạn chót.
@x ______ you pay online, you do not need to visit a branch.|Despite|If|Due to|During|B|Sau chỗ trống là mệnh đề you pay, nghĩa điều kiện: If.
@x The card will arrive ______ five business days.|within|since|among|beside|A|Within cộng khoảng thời gian.
@x We have been customers ______ 2015.|for|since|during|ago|B|Since cộng mốc thời gian 2015.
@x ______ the meeting, please turn off your phone.|During|While|Since|Because|A|During cộng danh từ the meeting.
@x He was late ______ the heavy traffic.|because|because of|although|so|B|The heavy traffic là cụm danh từ: because of.
@x You may withdraw cash ______ any ATM.|at|on|in|by|A|At cộng địa điểm cụ thể.
@x Interest is paid ______ the end of each month.|at|in|during|among|A|At the end of là cụm cố định.

@topic 11|So sánh|So sánh bằng, hơn và nhất với tính từ ngắn và dài.
@h Công thức
@t Dạng ¦ Tính từ ngắn ¦ Tính từ dài
@r So sánh bằng ¦ as + tính từ + as: as fast as ¦ as + tính từ + as: as secure as
@r So sánh hơn ¦ tính từ + er + than: faster than ¦ more + tính từ + than: more secure than
@r So sánh nhất ¦ the + tính từ + est: the fastest ¦ the most + tính từ: the most secure
@h Điều cần nhớ
@li Bất quy tắc: good - better - the best; bad - worse - the worst; much/many - more - the most; little - less - the least.
@li Nhấn mạnh so sánh hơn bằng much, far, even, still, a lot. Không dùng very ("very safer" là sai).
@li Càng ... càng ...: the + so sánh hơn, the + so sánh hơn. **The sooner** you pay, **the lower** the fee.
@x This card is ______ than the old one.|secure|more secure|most secure|securely|B|Tính từ dài + than: more secure.
@x Online banking is ______ convenient than visiting a branch.|most|more|as|very|B|More + tính từ dài + than.
@x This is the ______ way to log in.|safe|safer|safest|safely|C|The + so sánh nhất.
@x Expenses were ______ than forecast.|high|higher|highest|highly|B|Có than nên dùng so sánh hơn.
@x Our fees are as low ______ theirs.|as|than|that|to|A|As ... as.
@x The service is much ______ than before.|good|better|best|well|B|Much + so sánh hơn; better là dạng so sánh hơn của good.
@x The ______ you pay, the lower the fee.|soon|sooner|soonest|soonly|B|Cấu trúc the + so sánh hơn, the + so sánh hơn.
@x She is the ______ experienced manager here.|more|most|much|very|B|The most + tính từ dài.

@topic 12|Câu điều kiện|Loại 0, 1, 2, 3 và các từ thay cho if.
@h Bốn loại
@t Loại ¦ Dùng khi ¦ Công thức ¦ Ví dụ
@r 0 ¦ Sự thật luôn đúng ¦ If + hiện tại, hiện tại ¦ If you lose your card, you **should call** us.
@r 1 ¦ Có thể xảy ra ở tương lai ¦ If + hiện tại, will + V ¦ If you report fraud today, we **will freeze** your card.
@r 2 ¦ Giả sử trái thực tế hiện tại ¦ If + quá khứ, would + V ¦ If I **had** more savings, I **would buy** a house.
@r 3 ¦ Giả sử trái quá khứ ¦ If + had + V3, would have + V3 ¦ If you **had called**, we **would have helped**.
@h Ba điểm cần nhớ
@li Mệnh đề if không dùng will hoặc would. Sai: If you will pay. Đúng: If you pay.
@li Loại 2 dùng were cho mọi ngôi: If I **were** you, I would...
@li Đảo ngữ bỏ if: **Should** you need help = If you should need help. **Had** you called = If you had called.
@p **Từ thay if:** unless (nghĩa là if ... not), provided that, as long as, in case. Unless you **confirm** the transaction, we will cancel it.
@x If you report fraud today, we ______ your card.|freeze|will freeze|froze|have frozen|B|Loại 1: will + động từ.
@x If you ______ a suspicious message, do not click the link.|receive|will receive|received|receiving|A|Mệnh đề if dùng hiện tại đơn.
@x If I ______ more savings, I would buy a house.|have|had|will have|having|B|Loại 2: if + quá khứ.
@x If I ______ you, I would change my password.|am|were|will be|have been|B|Loại 2 dùng were.
@x ______ you confirm the payment, it will be canceled.|If|Unless|Although|Despite|B|Unless = if not: nếu không xác nhận thì sẽ bị hủy.
@x If you had called us, we ______ you.|helped|would help|would have helped|will help|C|Loại 3: would have + V3.
@x ______ you need help, please call us.|Should|Would|Will|May|A|Should you need help = if you should need help.
@x We will refund you ______ you return the card.|provided that|despite|because of|during|A|Provided that nghĩa là với điều kiện.

@topic 13|Danh từ đếm được và mạo từ|Quyết định dùng a/an, thêm s hay không, động từ số ít hay nhiều.
@h Đếm được và không đếm được
@t Loại ¦ Cách dùng ¦ Ví dụ
@r Đếm được, số ít ¦ a / an / one + danh từ ¦ a loan, an account, one branch
@r Đếm được, số nhiều ¦ danh từ + s/es ¦ three branches, many documents
@r Không đếm được ¦ Không dùng a/an, không thêm s ¦ information, advice, equipment, money, news
@p Thêm từ định lượng cho danh từ không đếm được: a piece of information, a piece of advice.
@h Mạo từ
@t Mạo từ ¦ Dùng khi ¦ Ví dụ
@r a ¦ Danh từ đếm được số ít, âm đầu là phụ âm, nhắc lần đầu ¦ a customer, a loan
@r an ¦ Như trên nhưng âm đầu là nguyên âm ¦ an account, an hour
@r the ¦ Đã xác định, cả hai bên đều biết ¦ The loan was approved.
@r (không có) ¦ Danh từ số nhiều hoặc không đếm được nói chung ¦ Banks offer loans.
@h Hạn định từ sở hữu và chỉ định
@li Sở hữu: my, your, his, her, its, our, their cộng danh từ. Her account is active.
@li Chỉ định: this, that (số ít); these, those (số nhiều).
@li Không dùng đồng thời mạo từ và sở hữu trước một danh từ: không nói "the my card".
@x We need more ______ about your income.|informations|information|an information|informed|B|Information không đếm được.
@x She opened ______ account in a new bank.|a|an|the|some|B|Account bắt đầu bằng nguyên âm, nhắc lần đầu: an.
@x The bank opened three new ______.|branch|branches|a branch|branching|B|Three cộng danh từ số nhiều.
@x Please give me ______ advice about loans.|some|an|a|many|A|Advice không đếm được: some advice.
@x We sell ______ equipment for tellers.|an|a|several|some|D|Equipment không đếm được: some equipment.
@x There is ______ ATM near the entrance.|a|an|the|any|B|ATM bắt đầu bằng nguyên âm /ei/: an.
@x ______ customers must sign the form.|Each|All|Every|Another|B|Danh từ số nhiều customers đi với All.
@x She introduced ______ to the manager.|she|her|herself|hers|C|Chủ ngữ và tân ngữ cùng một người: herself.

@topic 14|Lượng từ và đại từ|Chọn lượng từ theo danh từ đếm được hay không, đại từ theo chức năng.
@h Lượng từ
@t Lượng từ ¦ Đi với ¦ Ví dụ
@r many, a few, few, several, a number of, both, fewer ¦ Danh từ đếm được số nhiều ¦ many customers, several branches
@r much, a little, little, less, an amount of ¦ Danh từ không đếm được ¦ much information, less money
@r some, any, a lot of, plenty of, most, all ¦ Cả hai ¦ some documents, most of the time
@r each, every, either, neither, another, one ¦ Danh từ đếm được số ít ¦ each customer, every branch
@p **Hai cặp hay nhầm:** few (gần như không có) và a few (có vài cái); little (gần như không có) và a little (có một ít). Some dùng trong câu khẳng định, any trong câu phủ định và câu hỏi.
@h Đại từ
@t Chức năng ¦ I ¦ you ¦ he ¦ she ¦ it ¦ we ¦ they
@r Chủ ngữ ¦ I ¦ you ¦ he ¦ she ¦ it ¦ we ¦ they
@r Tân ngữ ¦ me ¦ you ¦ him ¦ her ¦ it ¦ us ¦ them
@r Tính từ sở hữu ¦ my ¦ your ¦ his ¦ her ¦ its ¦ our ¦ their
@r Đại từ sở hữu ¦ mine ¦ yours ¦ his ¦ hers ¦ its ¦ ours ¦ theirs
@r Phản thân ¦ myself ¦ yourself ¦ himself ¦ herself ¦ itself ¦ ourselves ¦ themselves
@p Phản thân dùng khi chủ ngữ và tân ngữ là cùng một người (She introduced **herself**) hoặc để nhấn mạnh (The manager **himself** approved it).
@x ______ applicant must show an ID.|All|Each|Many|Several|B|Each cộng danh từ số ít.
@x There are ______ customers waiting than yesterday.|fewer|less|little|much|A|Fewer cộng danh từ đếm được số nhiều.
@x We have ______ time to complete the form.|a few|a little|many|few|B|Time không đếm được: a little time.
@x Please send the receipt to ______.|I|my|me|mine|C|Tân ngữ sau giới từ: me.
@x ______ of the customers were satisfied.|Most|Almost|Much|Every|A|Most of the + danh từ số nhiều.
@x The manager ______ approved the request.|him|himself|he|his|B|Nhấn mạnh người làm hành động: himself.
@x The new card is better than ______.|our old|ours|we|us|B|Đại từ sở hữu ours thay cho our card.
@x I have ______ questions about the fee.|any|a few|much|a little|B|Questions đếm được số nhiều: a few.

@topic 15|Dạng từ (word form)|Phần chiếm nhiều câu nhất ở Part 5: bốn đáp án cùng gốc, khác loại từ.
@h Quy trình 3 bước
@li Nhìn từ ngay trước và ngay sau chỗ trống.
@li Quy ra loại từ cần điền theo bảng vị trí ở Chủ điểm 1.
@li Chọn đáp án có đuôi đúng loại. Còn hai đáp án cùng loại thì đọc nghĩa để chọn.
@h Gia đình từ ngân hàng cần thuộc
@t Động từ ¦ Danh từ (việc) ¦ Danh từ (người) ¦ Tính từ ¦ Trạng từ
@r apply ¦ application ¦ applicant ¦ applicable ¦
@r approve ¦ approval ¦ ¦ approved ¦
@r deposit ¦ deposit ¦ depositor ¦ ¦
@r require ¦ requirement ¦ ¦ required ¦
@r verify ¦ verification ¦ ¦ verified ¦
@r employ ¦ employment ¦ employer, employee ¦ employed ¦
@r decide ¦ decision ¦ ¦ decisive ¦ decisively
@r secure ¦ security ¦ ¦ secure ¦ securely
@r compete ¦ competition ¦ competitor ¦ competitive ¦ competitively
@r rely ¦ reliability ¦ ¦ reliable ¦ reliably
@r pay ¦ payment ¦ payer, payee ¦ payable ¦
@r invest ¦ investment ¦ investor ¦ ¦
@r manage ¦ management ¦ manager ¦ manageable ¦
@r inform ¦ information ¦ ¦ informative ¦
@h Đuôi nhận biết nhanh
@t Loại ¦ Đuôi hay gặp
@r Danh từ (việc) ¦ -tion, -sion, -ment, -ness, -ity, -ance, -ence, -age, -ship
@r Danh từ (người) ¦ -er, -or, -ant, -ent, -ist, -ee
@r Động từ ¦ -ize, -ify, -ate, -en
@r Tính từ ¦ -able, -ible, -al, -ful, -ous, -ive, -ic, -ish, -less

var GOAL=20,LV=['Khách mới','Tập sự','Giao dịch viên','Chuyên viên','Chuyên viên cao cấp','Trưởng nhóm','Phó phòng','Giám đốc chi nhánh'],LVX=150;

function pick(a){return a[Math.floor(Math.random()*a.length)];}
function level(){return Math.min(LV.length,Math.floor(P.xp/LVX)+1);}
function xpAdd(n){P.xp+=n;save();}
function goalPct(){return Math.min(100,Math.round(100*(P.days[today()]||0)/GOAL));}
function award(id){
  if(P.bd[id])return null;P.bd[id]=today();save();
  var b=BADGES.filter(function(x){return x[0]===id;})[0];return b;
}
function qCount(){return Object.keys(P.q).length;}
function checkBadges(){
  var got=[],st=streak();

function confetti(n){

function onAnswer(it,ok){

function paceInfo(){
  var d=Math.max(0,Math.round((new Date(today()).getTime()-new Date(P.start).getTime())/864e5)),exp=Math.min(100,Math.round(d/84*100));
  var tot=0,done=0;WEEKS.slice(0,BR).forEach(function(w){var s=weekStat(w);tot+=s.tot;done+=s.done;});
  var act=tot?Math.round(done/tot*100):0,gap=act-exp;

}
function paceText(p){

/* ---------- Bài kiểm tra trình độ ---------- */
var SKN={listen:'Nghe',gram:'Ngữ pháp',wf:'Dạng từ',vocab:'Từ vựng',read:'Đọc hiểu'};
function tWeight(q){return 1+0.5*(q.lvl-1);}
function tResult(ans){
  var sec={L:{w:0,g:0},R:{w:0,g:0}},sk={};
  TQ.forEach(function(q){
    var ok=ans[q.id]!==undefined&&q.o[ans[q.id]].ok,w=tWeight(q);
    sec[q.sec].w+=w;if(ok)sec[q.sec].g+=w;
    var s=sk[q.skill]||(sk[q.skill]={n:0,r:0});s.n++;if(ok)s.r++;
  });
  function sc(s){return Math.max(5,Math.min(495,Math.round((5+490*(s.g/s.w))/5)*5));}
  var L=sc(sec.L),R=sc(sec.R);
  return {d:today(),L:L,R:R,total:L+R,sk:sk,right:TQ.filter(function(q){return ans[q.id]!==undefined&&q.o[ans[q.id]].ok;}).length,n:TQ.length};
}
function tBand(t){return t<250?'Mới bắt đầu':t<400?'Sơ cấp':t<550?'Trung cấp thấp':t<650?'Trung cấp':t<800?'Khá':'Giỏi';}
function tStartWeek(t){return t<400?1:t<500?3:t<600?7:9;}
function lastTest(){return P.tests&&P.tests.length?P.tests[P.tests.length-1]:null;}

function startRec(){
  if(S.mic==='checking'){S.rec={err:'checking'};renderSheet();return;}
  if(!dict){S.rec={err:'nomic'};renderSheet();return;}
  stopSpeak();
  S.rec={active:true,listen:true,final:'',partial:'',result:null,err:'',audioErr:'pending'};
  var pr;try{pr=dict.start();}catch(e){pr=Promise.reject(e);}
  var thisRec=S.rec;renderSheet();
  Promise.resolve(pr).then(function(){if(S.rec===thisRec)startAudio(thisRec);},function(){});
  Promise.resolve(pr).catch(function(e){
    var code=e&&e.code;if((code==='unavailable'||code==='upstream_error')&&dict&&dict.kind==='claude'){var w2=webSpeech();if(w2){useDict(w2);S.rec={active:false,final:'',partial:'',result:null,err:'retry'};renderSheet();return;}}
    S.rec={active:false,final:'',partial:'',result:null,err:code==='not_granted'?'not_granted':(code==='dismissed'?'':'error')};renderSheet();
  });
}
function finishRec(){
  var r=S.rec;if(!r||r.done)return;r.done=true;r.active=false;r.listen=false;stopAudio();setTimeout(function(){if(!r.audio&&r.audioErr==='pending'){r.audioErr='empty';if(S.rec===r&&S.practice)renderSheet();}},4000);
  var heard=(r.final+' '+r.partial).trim();
  if(!heard){r.err='silent';}
  else{
    var c=cur();r.result=score(c.t,heard);
    P.pr[c.id]=Math.max(P.pr[c.id]||0,r.result.pct);
    if(!P.att)P.att={};P.att[c.id]=(P.att[c.id]||[]).concat([r.result.pct]).slice(-8);
    P.hist.push({t:Date.now(),s:r.result.pct});if(P.hist.length>60)P.hist=P.hist.slice(-60);
    touch();onSpeak(r.result.pct);
  }
  renderSheet();
}
function stopRec(){
  var r=S.rec;if(!r||!r.active)return;
  r.active=false;
  var go=function(){r.done=false;finishRec();};
  if(dict){Promise.resolve().then(function(){return dict.stop();}).then(go,go);}else go();
}
function bindDictation(d){
  d.onPartial(function(x){if(S.rec&&S.rec.listen){S.rec.partial=x.text||'';var l=$('#live');if(l)l.textContent=(S.rec.final+' '+S.rec.partial).trim();}});
  d.onFinal(function(x){if(S.rec&&S.rec.listen){S.rec.final=(S.rec.final+' '+(x.text||'')).trim();S.rec.partial='';var l=$('#live');if(l)l.textContent=S.rec.final;}});
  d.onState(function(x){if(x&&x.state==='idle'&&S.rec&&S.rec.active){S.rec.active=false;setTimeout(function(){S.rec.done=false;finishRec();},0);}});
}
function webSpeech(){
  var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return null;
  var rec=null,running=false,listening=false,hp=[],hf=[],hs=[];
  function fire(l,x){l.forEach(function(f){try{f(x);}catch(e){}});}
  return {
    kind:'browser',
    onPartial:function(f){hp.push(f);},onFinal:function(f){hf.push(f);},onState:function(f){hs.push(f);},
    /* Giữ một phiên nhận giọng mở suốt lúc luyện để trình duyệt không hỏi quyền micro mỗi lần nói */
    start:function(){return new Promise(function(res,rej){
      if(running){listening=true;res();return;}
      try{rec=new R();}catch(e){rej({code:'unavailable'});return;}
      rec.lang='en-US';rec.interimResults=true;rec.continuous=true;rec.maxAlternatives=1;
      rec.onstart=function(){running=true;listening=true;res();};
      rec.onresult=function(e){if(!listening)return;var part='';for(var i=e.resultIndex;i<e.results.length;i++){var r=e.results[i];if(r.isFinal)fire(hf,{text:r[0].transcript});else part+=r[0].transcript;}fire(hp,{text:part});};
      rec.onerror=function(e){var er=e&&e.error;if(er==='not-allowed'||er==='service-not-allowed'){running=false;rej({code:'not_granted'});}else if(er==='no-speech'||er==='aborted'){}else if(!running)rej({code:'error'});};
      rec.onend=function(){var was=listening;running=false;listening=false;if(was)fire(hs,{state:'idle',reason:'stopped'});};
      try{rec.start();}catch(e){rej({code:'error'});}
    });},
    stop:function(){return new Promise(function(res){setTimeout(function(){listening=false;res();},900);});},
    release:function(){listening=false;if(rec&&running){try{rec.stop();}catch(e){}}running=false;}
  };
}
function useDict(d){dict=d;bindDictation(d);S.mic='ok';}
function initMic(){
  var ws=webSpeech();
  function fallback(){if(ws){useDict(ws);}else S.mic='none';if(S.practice)renderSheet();}
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('dictation').then(function(d){
      if(d){d.kind='claude';useDict(d);if(S.practice)renderSheet();}else fallback();
    }).catch(fallback);
  }else fallback();
}

/* ---------- Điều hướng và sự kiện ---------- */
function navRender(){
  var items=[['home','#home','Học',IC.home],['cards','#cards','Ôn từ',IC.cards],['grammar','#grammar','Ngữ pháp',IC.book],['pron','#pron','Phát âm',IC.mic22],['progress','#progress','Tiến độ',IC.chart]];
  var active=S.route==='week'?'home':S.route==='gtopic'?'grammar':S.route==='ptopic'?'pron':S.route;
  navEl.innerHTML=items.map(function(i){return '<a href="'+i[1]+'"'+(active===i[0]?' aria-current="page"':'')+'>'+i[3]+'<span>'+i[2]+'</span></a>';}).join('');
}
function render(){
  app.innerHTML=S.route==='home'?viewHome():S.route==='week'?viewWeek():S.route==='cards'?viewCards():S.route==='test'?viewTest():S.route==='grammar'?viewGrammar():S.route==='gtopic'?viewGTopic(false):S.route==='pron'?viewPron():S.route==='ptopic'?viewGTopic(true):viewProgress();
  navRender();
}
function route(){
  var h=location.hash.slice(1)||'home',m=h.match(/^week-(\d+)$/);
  S.practice=null;S.rec=null;stopSpeak();renderSheet();
  if(m&&WEEKS[+m[1]-1]){S.route='week';S.week=+m[1];}
  else if(h==='grammar'){S.route='grammar';}
  else if((m=h.match(/^gram-(\d+)$/))&&GT[+m[1]-1]){S.route='gtopic';S.gt=+m[1];S.gtab='ref';S.gans=false;}
  else if(h==='test'){S.route='test';S.tmode='intro';S.treveal=false;}
  else if(h==='pron'){S.route='pron';}
  else if((m=h.match(/^pron-(\d+)$/))&&PT[+m[1]-1]){S.route='ptopic';S.gt=+m[1];S.gtab='ref';S.gans=false;}
  else if(h==='cards'){S.route='cards';S.deck=buildDeck(0);}
  else if(h==='progress'){S.route='progress';S.confirm=false;}
  else S.route='home';
  render();window.scrollTo(0,0);
}
function goWeek(n,tab){
  S.week=n;if(tab)S.tab=tab;
  if(location.hash==='#week-'+n){route();}else location.hash='week-'+n;
}
function weekBy(el){return WEEKS[+el.dataset.w-1];}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,w,b;
  switch(a){
    case 'bg':if(e.target===el)closeSheet();break;
    case 'close':closeSheet();break;
    case 'go':goWeek(+el.dataset.week,el.dataset.tab);break;
    case 'to-cards':if(location.hash==='#cards')route();else location.hash='cards';break;
    case 'tab':S.tab=el.dataset.tab;stopSpeak();render();break;
    case 'say':say(el.dataset.text);break;
    case 'say-word':say(el.dataset.w,0.7);break;
    case 'play-p2':playP2(QMAP[el.dataset.id]);break;
    case 'play-dlg':w=weekBy(el);playLines(w.blocks[+el.dataset.b].lines);break;
    case 'play-rd':w=weekBy(el);speakSeq(w.blocks[+el.dataset.b].paras.map(function(p){return {text:p.replace(/___\(\d\)___/g,' blank '),gap:500};}));break;
    case 'reveal':S.reveal[el.dataset.id]=!S.reveal[el.dataset.id];render();break;
    case 'ans':
      var it=QMAP[el.dataset.id],k=+el.dataset.k;
      if(S.chosen[it.id]!==undefined)break;
      S.chosen[it.id]=k;P.q[it.id]=it.o[k].ok?1:0;touch();render();onAnswer(it,it.o[k].ok);break;
    case 'prac-p':{var pt=PT[+el.dataset.t-1],ls=[];pt.ws.forEach(function(w,i){ls.push({id:'pw'+pt.id+'_'+i,t:w.say,ipa:w.ipa,vi:w.m,label:'Từ'});});pt.ss.forEach(function(s,i){ls.push({id:'ps'+pt.id+'_'+i,t:s.t,vi:s.vi,label:'Câu'});});openPractice(ls,+el.dataset.i);break;}
    case 't-start':P.test={i:0,a:{}};save();S.tmode='q';S.treveal=false;stopSpeak();render();window.scrollTo(0,0);break;
    case 't-resume':S.tmode='q';render();window.scrollTo(0,0);break;
    case 't-ans':P.test.a[TQ[P.test.i].id]=+el.dataset.k;save();render();break;
    case 't-next':if(P.test.a[TQ[P.test.i].id]===undefined)break;stopSpeak();if(P.test.i>=TQ.length-1){tFinish();}else{P.test.i++;S.treveal=false;save();}render();window.scrollTo(0,0);break;
    case 't-play':tPlay(TQ[P.test.i]);break;
    case 't-reveal':S.treveal=!S.treveal;render();break;
    case 't-exit':stopSpeak();S.tmode='intro';location.hash='#test';render();window.scrollTo(0,0);break;
    case 'gtab':S.gtab=el.dataset.tab;render();window.scrollTo(0,0);break;
    case 'gans':S.gans=!S.gans;render();break;
    case 'redo-g':(S.route==='ptopic'?PT:GT)[+el.dataset.t-1].qs.forEach(function(q){delete S.chosen[q.id];});S.gans=false;render();window.scrollTo(0,0);break;
    case 'redo':w=weekBy(el);w.p5.forEach(function(q){delete S.chosen[q.id];});render();window.scrollTo(0,0);break;
    case 'prac-v':
      w=weekBy(el);var v=w.vocab[+el.dataset.i];
      openPractice([{id:v.id+'w',t:v.w,vi:v.m,label:'Từ vựng'},{id:v.id+'x',t:v.ex,vi:'',label:'Câu ví dụ'}],0);break;
    case 'prac-s':
      w=weekBy(el);openPractice(w.sents.map(function(s){return {id:s.id,t:s.t,vi:s.vi,label:'Mẫu câu'};}),+el.dataset.i);break;
    case 'prac-dlg':
      w=weekBy(el);b=w.blocks[+el.dataset.b];
      openPractice(b.lines.map(function(l,i){return {id:b.id+'l'+i,t:l.t,vi:'',label:l.who};}),0);break;
    case 'prac-rd':
      w=weekBy(el);b=w.blocks[+el.dataset.b];
      openPractice([].concat.apply([],b.paras.map(splitSentences)).map(function(t,i){return {id:b.id+'r'+i,t:t,vi:'',label:'Đọc to'};}),0);break;
    case 'prac-card':{var cv=S.deck.list[S.deck.i];openPractice([{id:cv.id+'w',t:cv.w,vi:cv.m,label:'Từ vựng'},{id:cv.id+'x',t:cv.ex,vi:'',label:'Câu ví dụ'}],0);break;}
    case 'model':say(cur().t);break;
    case 'say-heard':if(S.rec&&S.rec.result)say(S.rec.result.heard.join(' '));break;
    case 'model-slow':say(cur().t,0.65);break;
    case 'rec-start':startRec();break;
    case 'rec-stop':stopRec();break;
    case 'typed':{var tv=($('#typed')||{}).value;tv=(tv||'').trim();if(!tv)break;S.rec={active:false,final:tv,partial:'',result:null,err:''};finishRec();break;}
    case 'snav':
      S.practice.i=Math.max(0,Math.min(S.practice.list.length-1,S.practice.i+(+el.dataset.d)));S.rec=null;stopSpeak();renderSheet(true);break;
    case 'flip':S.deck.flip=true;render();break;
    case 'rate':{
      var d=S.deck,cv2=d.list[d.i],s=P.srs[cv2.id],isNew=!s;
      s=s||{box:0,due:today()};
      if(isNew){if(P.nc.d!==today())P.nc={d:today(),n:0};P.nc.n++;}
      if(el.dataset.g==='1'){s.box=Math.min((s.box||0)+1,5);s.due=addDays(today(),[0,1,2,4,8,16][s.box]);}
      else{s.box=0;s.due=today();d.list.push(cv2);}
      P.srs[cv2.id]=s;touch();d.i++;d.flip=false;render();window.scrollTo(0,0);break;}
    case 'cards-more':S.deck=buildDeck(10);render();break;
    case 'reset-ask':S.confirm=!S.confirm;render();break;
    case 'reset-do':P={q:{},pr:{},srs:{},days:{},hist:[],nc:{d:'',n:0}};initP();save();S.chosen={};S.confirm=false;render();toast('Đã xóa tiến độ.');break;
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.practice)closeSheet();});
window.addEventListener('hashchange',route);
initMic();
route();
})();
</script>
</html>
